<p-toast />
@if (!progressbarService.progressbarProcess()) {
  <app-dialog-message></app-dialog-message>
  <router-outlet></router-outlet>
} @else {
  <div class="container-progressbar">
    <h1 class="text-1xl text-center text-(--p-primary-color) font-bold">
      {{ progressbarService.showMessage() }}
    </h1>
    <app-progressbar></app-progressbar>
  </div>
}
