<p-button
  [label]="buttonValues().label1.label"
  [raised]="true"
  severity="secondary"
  (onClick)="onClickEasyButton(buttonValues().label1.value)"
/>
<p-button
  [label]="buttonValues().label2.label"
  [raised]="true"
  severity="success"
  (onClick)="onClickMediumButton(buttonValues().label2.value)"
/>
<p-button
  [label]="buttonValues().label3.label"
  [raised]="true"
  severity="danger"
  (onClick)="onClickDifficultButton(buttonValues().label3.value)"
/>
