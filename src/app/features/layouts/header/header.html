<div class="card">
  <p-menubar>
    <ng-template #start>
      @if(locationPathName !== '/' && locationPathName !== '') {
      <i
        class="pi pi-arrow-left ml-5 mr-5"
        style="font-size: 1.5rem"
        (click)="goBack()"
      ></i>
      }
      <h1 class="text-3xl">Flash Color Cards</h1>
    </ng-template>

    <ng-template #end>
      <div class="flex items-center gap-2">
        <input
          #inputSearch
          type="text"
          pInputText
          placeholder="Search"
          class="w-36"
        />
        <p-avatar
          image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          shape="circle"
        />
        <p-menubar [model]="hambuguerMenu"></p-menubar>
      </div>
    </ng-template>
  </p-menubar>
</div>
